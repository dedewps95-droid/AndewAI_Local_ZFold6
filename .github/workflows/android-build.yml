name: AndewAI RC8 Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Reconstruct RC8 source
        run: |
          set -e
          cat rc8-source.zip.part* > rc8-source.zip
          unzip -t rc8-source.zip
          rm -rf rc8-source
          mkdir rc8-source
          unzip -q rc8-source.zip -d rc8-source

      - name: Locate Android project
        id: project
        run: |
          set -e
          GRADLEW="$(find rc8-source -type f -name gradlew -print -quit)"
          test -n "$GRADLEW"
          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Build RC8 debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p artifacts
          find rc8-source -type f -name "*.apk" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndewAI_Local_ZFold6_RC8_APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
